<!doctype html><html lang="ko"><meta charset="utf-8"><body>
<h2>순아래 설치를 마쳤습니다</h2>
<p>입력 메뉴에서 <b>두벌식 순아래</b>를 선택하고, 사용 승인 요청을 확인하세요.</p>
<p>목록에 없다면 로그아웃 후 다시 로그인한 뒤 <b>시스템 설정 → 키보드 → 텍스트 입력 → 편집</b>에서 추가하세요.</p>
<p>설치 직후 특정 앱에서 영문만 나오면 작성 중인 내용을 보관하고 그 앱을 완전히 종료한 뒤 다시 여세요.</p>
<p>설치 위치: ~/Library/Input Methods/Sunarae.app</p>
</body></html>
