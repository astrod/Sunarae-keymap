<h2>두벌식 순아래 설치</h2>
<p>현재 사용자의 입력기 폴더에 순아래를 설치합니다. 별도 설치 앱이나 터미널 명령은 필요하지 않습니다.</p>
<p>순아래를 사용 중이라면 설치 전에 ABC로 전환합니다. 작성 중인 내용은 먼저 보관해 주세요.</p>
<p>등록 ID가 다른 이전 버전에서 옮기면 새 입력기로 등록합니다. Esc 전환과 한영 전환 키는 새로 설정해 주세요.</p>
<p>macOS가 요청하는 입력기 사용 승인은 직접 확인해야 합니다.</p>
</body></html>
